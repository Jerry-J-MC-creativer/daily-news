<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面无法打开 — 每日全球要闻</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1a1a2e; --sub: #6b7280;
    --accent: #4f6ef7; --border: #e5e7eb; --shadow: rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117; --card: #1a1d27; --text: #e5e7eb; --sub: #9ca3af;
      --border: #2d3141; --shadow: rgba(0,0,0,0.3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .box {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 48px 36px; max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 8px 32px var(--shadow);
  }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 24px;
    background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  p { color: var(--sub); font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
  .reasons {
    text-align: left; background: var(--bg); border-radius: 12px;
    padding: 16px 20px; margin: 20px 0; font-size: 13px; color: var(--sub); line-height: 1.9;
  }
  .reasons li { list-style: none; padding-left: 18px; position: relative; }
  .reasons li::before { content: '•'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
  .email {
    margin: 20px 0 8px; font-size: 14px; color: var(--text);
  }
  .email a {
    color: var(--accent); text-decoration: none; font-weight: 600;
    word-break: break-all;
  }
  .email a:hover { text-decoration: underline; }
  .btn {
    display: inline-block; margin-top: 16px;
    background: var(--accent); color: #fff; text-decoration: none;
    padding: 12px 28px; border-radius: 999px; font-size: 14px; font-weight: 600;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,110,247,.35); }
  footer { margin-top: 24px; font-size: 12px; color: var(--sub); }

  @media (max-width: 480px) {
    .box { padding: 36px 24px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">!</div>
    <h1>对不起，您访问的页面无法打开</h1>
    <p>可能遇到了以下问题，请您尝试排查：</p>
    <ul class="reasons">
      <li>网络连接不稳定或已断开</li>
      <li>该页面链接已过期或已被移除</li>
      <li>服务器暂时繁忙，请稍后刷新重试</li>
      <li>浏览器缓存异常，可尝试清除缓存</li>
    </ul>
    <p class="email">
      如果问题持续存在，欢迎联系：<br>
      <a href="mailto:jerryjwx@163.com" style="color:#0078d4">jerryjwx@163.com</a>
    </p>
    <button class="btn" type="button" onclick="history.back()">← 返回刚才</button>
    <a class="btn" href="index.html">← 返回主页</a>
    <footer>每日全球要闻</footer>
  </div>
<script>
/* 所有链接默认新标签页打开，除了「返回主页」和页内锚点（用委托监听，覆盖动态生成的链接） */
(function(){
  function isHomeLink(a){
    var h = (a.getAttribute('href')||'').trim();
    if (h === 'index.html' || h.indexOf('index.html#') === 0) return true;
    var t = (a.textContent||'').trim();
    if (/返回主页|返回首页|back[\s-]?home/i.test(t)) return true;
    return false;
  }
  document.addEventListener('click', function(e){
    if (e.defaultPrevented) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // 保留系统自带的新开/下载手势
    var t = e.target;
    if (!t || !t.closest) return;
    var a = t.closest('a');
    if (!a) return;
    var h = (a.getAttribute('href')||'').trim();
    if (!h) return;
    if (h.charAt(0) === '#') return;                                   // 页内锚点
    if (/^(mailto:|tel:|javascript:)/i.test(h)) return;                // 邮箱/电话/脚本链接
    if (a.hasAttribute('download')) return;                            // 下载（如导出设置）
    if ((a.getAttribute('target')||'').toLowerCase() === '_self') return;
    if (isHomeLink(a)) return;                                         // 返回主页不新开
    e.preventDefault();
    window.open(h, '_blank', 'noopener');
  }, true);
})();
</script>
</body>
</html>
